# Model setup: Gemini for every role (one API key).
#   agent gemini-3.8-flash · judge gemini-3.1-pro-preview · reviewer gemini-3.8-flash ·
#   second judge gemma-4-31b-it (open model, different lineage, through the Gemini API)
# Keys are read from api_env.yaml in the project root. Never commit api_env.yaml.
llm_defaults:
  provider: gemini
  model: gemini-3.8-flash
  api_env: ../../api_env.yaml
  reasoning_effort: low           # ~7x fewer thinking tokens than the default
  max_tokens: 16000
  concurrency: 6
  # USD per 1M tokens (check current price pages; used for the budget guard)
  pricing: {input_per_m: 0.75, output_per_m: 3.75}

roles:
  agent: {}                       # does the review work
  reviewer: {}                    # simulated human auditor for Claim 1
  judge:                          # LLM-as-judge (evaluation only)
    model: gemini-3.1-pro-preview
    pricing: {input_per_m: 2.00, output_per_m: 12.00}
  judge2:                         # second judge (inter-judge agreement)
    model: gemma-4-31b-it
    reasoning_effort: null
    pricing: {input_per_m: 0.10, output_per_m: 0.30}   # conservative placeholder
