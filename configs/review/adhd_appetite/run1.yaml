# Review run: adhd_appetite · claude-haiku-5-5 · all records · human in the loop.
include:
  - topic.yaml
llm_defaults:                # request settings every model uses
  api_env: ../../../api_env.yaml
  max_tokens: 16000
  concurrency: 6
cache_dir: .cache
budget:                  # USD limits of this run folder: the total, and each stage that calls a model (a number or unlimited)
  total_usd: 15
  stages:
    protocol: unlimited
    search: unlimited
    screen: unlimited
    eligibility: unlimited
    snowball: unlimited
    extract: unlimited
    rob: unlimited
    synthesis: unlimited
    feedback: unlimited
contact_email: parkjiwoo9980@gmail.com          # Unpaywall open-access full texts need it
pipeline:
  human_mode: human_in_the_loop
  confirm_search: true     # the search runs with the query you confirm in the To-do list
  wait_for_pdfs: true      # the synthesis waits until the requested PDFs are supplied or declared not obtainable
models:                      # models.<stage>.<role> over models.default; provider and price come from configs/models.yaml
  default: {verifier: {model: gpt-6.1-sol, provider: openai}, writer: {model: claude-haiku-5-5, reasoning_effort: medium}}
  protocol: {writer: claude-sonnet-5-5}
  search: {writer: claude-sonnet-5-5}
  synthesis: {writer: claude-sonnet-5-5}
  feedback: {writer: claude-sonnet-5-5}
