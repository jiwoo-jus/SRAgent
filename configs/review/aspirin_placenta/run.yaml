# Review run: aspirin_placenta · claude-haiku-5-5 · all records · human in the loop.
include:
  - topic.yaml
llm_defaults:                # request settings every model uses
  api_env: ../../../api_env.yaml
  max_tokens: 16000
  concurrency: 6
cache_dir: .cache
budget_usd: 10           # hard cost cap for this run folder
contact_email: parkjiwoo9980@gmail.com          # Unpaywall open-access full texts need it
pipeline:
  human_mode: human_in_the_loop
  confirm_search: true     # the search runs with the query you confirm in the To-do list
  wait_for_pdfs: true      # the synthesis waits until the requested PDFs are supplied or declared not obtainable
  verify_rob: flagged      # risk-of-bias drafts with a reason for a second look go to the verifier; what it cannot settle -> you
  verify_screening: pending   # off | pending | full_text | all
models:                      # models.<stage>.<role> over models.default; provider and price come from configs/models.yaml
  default: {verifier: {model: gpt-6.1-sol, provider: openai, reasoning_effort: high}, writer: {model: claude-haiku-5-5, reasoning_effort: medium}}
  protocol: {writer: {model: claude-sonnet-5-5, reasoning_effort: high}}
  search: {writer: {model: claude-sonnet-5-5, reasoning_effort: high}}
  synthesis: {writer: claude-sonnet-5-5}
  feedback: {writer: {model: claude-sonnet-5-5, reasoning_effort: high}}
