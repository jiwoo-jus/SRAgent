<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRAgent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M8 10h16l-6 7v5l-4 2v-7z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 6h16l-6 7v5l-4 2v-7z"/></svg></div>
      <div><b>SRAgent</b><span>Systematic review workspace</span></div>
    </div>
    <div class="runcard">
      <div class="rn"><svg class="i sm" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span id="runname" title="Run folder">…</span>
        <a class="switch" href="#/configs" title="Open another run file">Switch</a></div>
      <div class="q" id="topic"></div>
      <div class="meta"><span id="mode"></span></div>
    </div>
    <nav class="navl" id="tabs">
      <a href="#/steps" data-t="steps"><svg class="i" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>Overview</a>
      <div class="lbl">Stages</div>
      <div id="stagenav" class="stagenav"></div>
      <div class="lbl">Review</div>
      <a href="#/needs" data-t="needs"><svg class="i" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg>Needs you<span id="needs-n" class="cnt warn"></span></a>
      <a href="#/studies" data-t="studies"><svg class="i" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Studies</a>
      <div class="lbl">Agent</div>
      <a href="#/activity" data-t="activity"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Activity<span id="act-n" class="cnt info"></span></a>
      <div class="lbl">Output</div>
      <a href="/report" id="reportlink" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>Report<svg class="i sm" viewBox="0 0 24 24" style="margin-left:auto;color:var(--mut-2)"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
      <a href="/manuscript" id="manuscriptlink" class="off" target="_blank" rel="noopener" title="The report for readers, built from this review's report_plan.yaml"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>For readers<svg class="i sm" viewBox="0 0 24 24" style="margin-left:auto;color:var(--mut-2)"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
      <div class="lbl">Setup</div>
      <a href="#/settings" data-t="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
      <a href="#/configs" data-t="configs"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m10 13-2 2 2 2M14 13l2 2-2 2"/></svg>Configs</a>
    </nav>
    <div class="side-foot">
      <div id="jobw"></div>
      <div class="side-row"><svg class="i sm" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Spent <b id="spent">–</b><span class="grow"></span>
        <button class="iconbtn" id="themebtn" onclick="cycleTheme()" title="Theme"></button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
  <div class="mainw">
    <header class="topbar">
      <button class="iconbtn menu" onclick="toggleSide()" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="grow" style="min-width:0"><h1 id="ptitle">Overview</h1><div class="sub" id="psub"></div></div>
      <div id="topjob"></div>
    </header>
    <main>
      <section id="v-steps"></section>
      <section id="v-stage" hidden></section>
      <section id="v-needs" hidden></section>
      <section id="v-settings" hidden></section>
      <section id="v-studies" hidden></section>
      <section id="v-activity" hidden></section>
      <section id="v-configs" hidden></section>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="/static/js/app.js"></script>
<script src="/static/js/ops.js"></script>
<script src="/static/js/stage.js"></script>
<script src="/static/js/needs.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
