[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sragent"
version = "0.3.0"
description = "Human-in-the-loop, evidence-linked agent for systematic reviews (research prototype)"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "pyyaml>=6",
  "requests>=2.31",
  "rapidfuzz>=3.0",
  "pandas>=2.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sragent = "sragent.cli:main"

[tool.setuptools.packages.find]
include = ["sragent*"]

